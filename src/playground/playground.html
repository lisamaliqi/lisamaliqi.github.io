<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playground — Lisa Maliqi</title>
    <meta name="description" content="A place for Lisa Maliqi's smaller experiments — interface ideas, CSS sketches and things built for the fun of it.">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08081A" media="(prefers-color-scheme: dark)">

    <link rel="icon" href="https://fav.farm/👾">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/style/base.css">
    <link rel="stylesheet" href="../assets/style/projects.css">
    <link rel="stylesheet" href="../assets/style/theme-lab.css">

    <script>
        try {
            var t = localStorage.getItem("theme");
            if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;

            var lab = localStorage.getItem("theme-lab");
            if (lab) {
                var tokens = JSON.parse(lab).tokens || {};
                for (var k in tokens) document.documentElement.style.setProperty(k, tokens[k]);
            }
        } catch (e) {}
    </script>
</head>
<body>

</svg>
